  <section class="section container tool-shell">
    <div class="tool-hero">
      <nav class="crumbs">
        <a href="/">Home</a><span class="sep">›</span>
        <a href="/tools/">Tools</a><span class="sep">›</span>
        <span>Whitespace Cleaner</span>
      </nav>

      <h1 class="section-title">Whitespace Cleaner</h1>
      <p class="kicker">Remove extra spaces, normalize line breaks, and trim text for clean copy.</p>

      <div class="mini-trust">
        <span class="mini-pill">🔒 Browser-only</span>
        <span class="mini-pill">🧹 Clean output</span>
        <span class="mini-pill">📋 Copy-ready</span>
      </div>
    </div>

    <div class="tool-panel">
      <div class="tool-grid">
        <div>
          <label class="field-label" for="wcInput">Paste your text</label>
          <textarea id="wcInput" class="jf-editor" placeholder="Paste messy text here..."></textarea>
          <div class="field">
            <label class="field-label">Cleaning options</label>
            <div class="hint">
              <label><input type="checkbox" id="wcTrimLines" checked /> Trim each line</label><br />
              <label><input type="checkbox" id="wcCollapseSpaces" checked /> Collapse multiple spaces</label><br />
              <label><input type="checkbox" id="wcRemoveBlank" checked /> Remove extra blank lines</label>
            </div>
          </div>
          <div class="tool-actions">
            <button class="btn primary" type="button" id="wcClean">🧹 Clean text</button>
            <button class="btn ghost" type="button" id="wcClear">🧼 Clear</button>
          </div>
        </div>
        <div>
          <label class="field-label" for="wcOutput">Cleaned output</label>
          <textarea id="wcOutput" class="jf-editor" readonly>Paste text and click Clean.</textarea>
          <div class="tool-actions">
            <button class="btn ghost" type="button" id="wcCopy">📋 Copy output</button>
          </div>
          <div class="stat-grid">
            <div class="stat-card">
              <div class="k">Original length</div>
              <div class="v" id="wcOriginal">0</div>
            </div>
            <div class="stat-card">
              <div class="k">Clean length</div>
              <div class="v" id="wcCleaned">0</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="/assets/site.js" defer></script>
  <script>
    const input = document.getElementById('wcInput');
    const output = document.getElementById('wcOutput');
    const trimLines = document.getElementById('wcTrimLines');
    const collapseSpaces = document.getElementById('wcCollapseSpaces');
    const removeBlank = document.getElementById('wcRemoveBlank');
    const cleanBtn = document.getElementById('wcClean');
    const clearBtn = document.getElementById('wcClear');
    const copyBtn = document.getElementById('wcCopy');
    const originalEl = document.getElementById('wcOriginal');
    const cleanedEl = document.getElementById('wcCleaned');

    const cleanText = () => {
      const value = input.value || '';
      originalEl.textContent = value.length.toString();
      if (!value.trim()) {
        output.value = 'Paste text and click Clean.';
        cleanedEl.textContent = '0';
        return;
      }

      let result = value;
      if (trimLines.checked) {
        result = result.split(/\r?\n/).map((line) => line.trim()).join('\n');
      }
      if (collapseSpaces.checked) {
        result = result.replace(/\s{2,}/g, ' ');
      }
      if (removeBlank.checked) {
        result = result.replace(/(\n\s*){2,}/g, '\n');
      }
      output.value = result.trim();
      cleanedEl.textContent = output.value.length.toString();
    };

    cleanBtn.addEventListener('click', cleanText);
    clearBtn.addEventListener('click', () => {
      input.value = '';
      output.value = 'Paste text and click Clean.';
      originalEl.textContent = '0';
      cleanedEl.textContent = '0';
    });
    copyBtn.addEventListener('click', async () => {
      if (!output.value || output.value.includes('Paste text')) return;
      await navigator.clipboard.writeText(output.value);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy output'; }, 1200);
    });
  </script>
