<body class="bigtext jf">
  <div id="clickozParticles" aria-hidden="true"></div>
  <canvas id="spaceParticles" aria-hidden="true"></canvas>
  <div class="__grain" aria-hidden="true"></div>

  <nav class="nav" aria-label="Primary navigation" id="topNav">
    <div class="container nav-inner">
      <a class="logo" href="/" aria-label="Clickoz Home">
        <span class="logo-badge" id="logoBadge" aria-hidden="true">
          <svg class="logo-mark" viewBox="0 0 48 48" width="1em" height="1em" aria-hidden="true" focusable="false">
            <path d="M32.5 13.5c-2.4-2.2-5.4-3.3-8.9-3.3-7.2 0-12.6 5.1-12.6 13.8S16.4 37.8 23.6 37.8c3.6 0 6.7-1.2 9.2-3.6"
              fill="none" stroke="currentColor" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="logo-text">Click<span class="logo-oz">oz</span></span>
      </a>

      <div class="nav-links" aria-label="Sections">
        <a href="/">Home</a>
        <a href="/tools/">Tools</a>
        <a href="/guides/">Guides</a>
        <a href="/updates/">Updates</a>
      </div>

      <div class="spacer"></div>

      <div class="nav-actions" aria-label="Preferences">
        <div id="gtNavWrap" aria-label="Translate">
          <div id="google_translate_element"></div>
        </div>
      </div>
    </div>
  </nav>

  <section class="section container tool-shell">
    <div class="tool-hero">
      <nav class="crumbs">
        <a href="/">Home</a><span class="sep">›</span>
        <a href="/tools/">Tools</a><span class="sep">›</span>
        <span>JSON Minifier</span>
      </nav>

      <h1 class="section-title">JSON Minifier</h1>
      <p class="kicker">Compress JSON by removing whitespace. Ideal for shrinking payloads before sharing or shipping.</p>

      <div class="mini-trust">
        <span class="mini-pill">🔒 Browser-only</span>
        <span class="mini-pill">⚡ Instant</span>
        <span class="mini-pill">🧾 Clean JSON</span>
      </div>
    </div>

    <div class="tool-panel">
      <div class="tool-grid">
        <div>
          <label class="field-label" for="jmInput">Paste JSON</label>
          <textarea id="jmInput" class="jf-editor" placeholder='{"name": "Clickoz"}'></textarea>
          <div class="tool-actions">
            <button class="btn primary" type="button" id="jmMinify">↘ Minify JSON</button>
            <button class="btn ghost" type="button" id="jmClear">🧼 Clear</button>
          </div>
          <p class="hint" id="jmError"></p>
        </div>
        <div>
          <label class="field-label" for="jmOutput">Minified output</label>
          <textarea id="jmOutput" class="jf-editor" readonly>Paste JSON to minify.</textarea>
          <div class="tool-actions">
            <button class="btn ghost" type="button" id="jmCopy">📋 Copy output</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="/assets/site.js" defer></script>
  <script>
    const input = document.getElementById('jmInput');
    const output = document.getElementById('jmOutput');
    const errorEl = document.getElementById('jmError');
    const minifyBtn = document.getElementById('jmMinify');
    const clearBtn = document.getElementById('jmClear');
    const copyBtn = document.getElementById('jmCopy');

    const minifyJson = () => {
      errorEl.textContent = '';
      const value = input.value.trim();
      if (!value) {
        output.value = 'Paste JSON to minify.';
        return;
      }
      try {
        const parsed = JSON.parse(value);
        output.value = JSON.stringify(parsed);
      } catch (error) {
        output.value = 'Invalid JSON. Please fix the syntax.';
        errorEl.textContent = `Error: ${error.message}`;
      }
    };

    minifyBtn.addEventListener('click', minifyJson);
    clearBtn.addEventListener('click', () => {
      input.value = '';
      output.value = 'Paste JSON to minify.';
      errorEl.textContent = '';
    });
    copyBtn.addEventListener('click', async () => {
      if (!output.value || output.value.includes('Paste JSON')) return;
      await navigator.clipboard.writeText(output.value);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy output'; }, 1200);
    });
  </script>
</body>
</html>
