      <h1 class="section-title">Text Case Converter</h1>
      <p class="kicker">Convert your text to uppercase, lowercase, sentence case, title case, or toggle case in one click.</p>

      <div class="mini-trust">
        <span class="mini-pill">🔒 Browser-only</span>
        <span class="mini-pill">🧩 Fast conversions</span>
        <span class="mini-pill">📋 Copy-ready</span>
      </div>
    </div>

    <div class="tool-panel">
      <div class="tool-grid">
        <div>
          <label class="field-label" for="tcInput">Your text</label>
          <textarea id="tcInput" class="jf-editor" placeholder="Paste your text here..."></textarea>
          <div class="tool-actions">
            <button class="btn ghost" type="button" data-action="upper">UPPERCASE</button>
            <button class="btn ghost" type="button" data-action="lower">lowercase</button>
            <button class="btn ghost" type="button" data-action="title">Title Case</button>
            <button class="btn ghost" type="button" data-action="sentence">Sentence case</button>
            <button class="btn ghost" type="button" data-action="toggle">tOGGLE cASE</button>
          </div>
          <div class="tool-actions">
            <button class="btn ghost" type="button" id="tcClear">🧼 Clear</button>
            <button class="btn primary" type="button" id="tcCopy">📋 Copy output</button>
          </div>
        </div>
        <div>
          <label class="field-label" for="tcOutput">Converted text</label>
          <textarea id="tcOutput" class="jf-editor" readonly>Paste text and choose a conversion.</textarea>
        </div>
      </div>
    </div>
  </section>

  <script src="/assets/site.js" defer></script>
  <script>
    const input = document.getElementById('tcInput');
    const output = document.getElementById('tcOutput');
    const clearBtn = document.getElementById('tcClear');
    const copyBtn = document.getElementById('tcCopy');

    const toTitleCase = (text) => text.toLowerCase().replace(/\b\w/g, (char) => char.toUpperCase());
    const toSentenceCase = (text) => text.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g, (char) => char.toUpperCase());
    const toToggleCase = (text) => text.split('').map((char) => {
      const upper = char.toUpperCase();
      const lower = char.toLowerCase();
      return char === upper ? lower : upper;
    }).join('');

    const applyCase = (action) => {
      const value = input.value || '';
      if (!value.trim()) {
        output.value = 'Paste text and choose a conversion.';
        return;
      }
      let result = value;
      if (action === 'upper') result = value.toUpperCase();
      if (action === 'lower') result = value.toLowerCase();
      if (action === 'title') result = toTitleCase(value);
      if (action === 'sentence') result = toSentenceCase(value);
      if (action === 'toggle') result = toToggleCase(value);
      output.value = result;
    };

    document.querySelectorAll('[data-action]').forEach((button) => {
      button.addEventListener('click', () => applyCase(button.dataset.action));
    });

    clearBtn.addEventListener('click', () => {
      input.value = '';
      output.value = 'Paste text and choose a conversion.';
    });

    copyBtn.addEventListener('click', async () => {
      if (!output.value || output.value.includes('Paste text')) return;
      await navigator.clipboard.writeText(output.value);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy output'; }, 1200);
    });
  </script>
