<body class="bigtext jf">
  <div id="clickozParticles" aria-hidden="true"></div>
  <canvas id="spaceParticles" aria-hidden="true"></canvas>
  <div class="__grain" aria-hidden="true"></div>

  <nav class="nav" aria-label="Primary navigation" id="topNav">
    <div class="container nav-inner">
      <a class="logo" href="/" aria-label="Clickoz Home">
        <span class="logo-badge" id="logoBadge" aria-hidden="true">
          <svg class="logo-mark" viewBox="0 0 48 48" width="1em" height="1em" aria-hidden="true" focusable="false">
            <path d="M32.5 13.5c-2.4-2.2-5.4-3.3-8.9-3.3-7.2 0-12.6 5.1-12.6 13.8S16.4 37.8 23.6 37.8c3.6 0 6.7-1.2 9.2-3.6"
              fill="none" stroke="currentColor" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="logo-text">Click<span class="logo-oz">oz</span></span>
      </a>

      <div class="nav-links" aria-label="Sections">
        <a href="/">Home</a>
        <a href="/tools/">Tools</a>
        <a href="/guides/">Guides</a>
        <a href="/updates/">Updates</a>
      </div>

      <div class="spacer"></div>

      <div class="nav-actions" aria-label="Preferences">
        <div id="gtNavWrap" aria-label="Translate">
          <div id="google_translate_element"></div>
        </div>
      </div>
    </div>
  </nav>

  <section class="section container tool-shell">
    <div class="tool-hero">
      <nav class="crumbs">
        <a href="/">Home</a><span class="sep">›</span>
        <a href="/tools/">Tools</a><span class="sep">›</span>
        <span>Slug Generator</span>
      </nav>

      <h1 class="section-title">Slug Generator</h1>
      <p class="kicker">Turn any headline into a clean, SEO-friendly URL slug with optional separators.</p>

      <div class="mini-trust">
        <span class="mini-pill">🔒 Browser-only</span>
        <span class="mini-pill">🔗 Clean slugs</span>
        <span class="mini-pill">⚡ Instant</span>
      </div>
    </div>

    <div class="tool-panel">
      <div class="tool-grid">
        <div>
          <label class="field-label" for="sgInput">Title or phrase</label>
          <textarea id="sgInput" class="jf-editor" placeholder="e.g. 10 Productivity Tips for Remote Teams"></textarea>
          <div class="field">
            <label class="field-label" for="sgSeparator">Separator</label>
            <select id="sgSeparator" class="jf-select">
              <option value="-">Dash (-)</option>
              <option value="_">Underscore (_)</option>
            </select>
          </div>
          <div class="tool-actions">
            <button class="btn ghost" type="button" id="sgClear">🧼 Clear</button>
            <button class="btn primary" type="button" id="sgSample">✨ Load sample</button>
          </div>
        </div>
        <div>
          <label class="field-label" for="sgOutput">Generated slug</label>
          <textarea id="sgOutput" class="jf-editor" readonly>Type to generate a slug.</textarea>
          <div class="tool-actions">
            <button class="btn ghost" type="button" id="sgCopy">📋 Copy slug</button>
          </div>
          <p class="hint">Lowercase, trimmed, and stripped of symbols for clean URLs.</p>
        </div>
      </div>
    </div>
  </section>

  <script src="/assets/site.js" defer></script>
  <script>
    const input = document.getElementById('sgInput');
    const separator = document.getElementById('sgSeparator');
    const output = document.getElementById('sgOutput');
    const clearBtn = document.getElementById('sgClear');
    const sampleBtn = document.getElementById('sgSample');
    const copyBtn = document.getElementById('sgCopy');

    const slugify = (text, sep) => {
      return text
        .normalize('NFKD')
        .replace(/[^\p{L}\p{N}\s-]/gu, '')
        .trim()
        .replace(/\s+/g, sep)
        .replace(/-+/g, sep)
        .toLowerCase();
    };

    const updateSlug = () => {
      const text = input.value;
      if (!text.trim()) {
        output.value = 'Type to generate a slug.';
        return;
      }
      output.value = slugify(text, separator.value);
    };

    input.addEventListener('input', updateSlug);
    separator.addEventListener('change', updateSlug);

    clearBtn.addEventListener('click', () => {
      input.value = '';
      updateSlug();
      input.focus();
    });

    sampleBtn.addEventListener('click', () => {
      input.value = '10 Productivity Tips for Remote Teams';
      updateSlug();
    });

    copyBtn.addEventListener('click', async () => {
      if (!output.value || output.value.includes('Type to generate')) return;
      await navigator.clipboard.writeText(output.value);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy slug'; }, 1200);
    });

    updateSlug();
  </script>
</body>
</html>
